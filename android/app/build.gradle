apply plugin: 'com.android.application'

// Versie uit git, zodat elke build vanzelf een hoger nummer krijgt: het aantal
// commits (versionCode, moet voor Google Play steeds hoger worden; ×2 voor
// beta en stabiel, zie hieronder) en de
// korte commit-hash. Te zien bij Instellingen in de app en in Android onder
// Apps → Fluistervink. Zonder git (bv. een los archief) blijft het 1.
def git(String... args) {
    try {
        def proc = (['git'] + args.toList()).execute(null, rootProject.projectDir)
        proc.waitFor()
        return proc.exitValue() == 0 ? proc.text.trim() : null
    } catch (ignored) {
        return null
    }
}
def commitCount = git('rev-list', '--count', 'HEAD')?.toInteger() ?: 1
def commitHash = git('rev-parse', '--short', 'HEAD') ?: 'onbekend'

// Ondertekenen met de upload-key voor Google Play (fase 4, docs/google-play.md).
// GitHub Actions zet deze variabelen uit de secrets (.github/workflows/release.yml).
// Zonder (lokaal) wordt de release-build niet ondertekend en blijft
// assembleDebug gewoon werken met de debug-sleutel.
def uploadKeystore = System.getenv('UPLOAD_KEYSTORE_FILE')

// Beta of stabiel (docs/omgevingen.md). De release-workflow bouwt bij elke tag
// beide; de webcode komt van het adres in capacitor.config.ts (CAP_SERVER_URL).
// Eén app in Play: de beta gaat naar de interne test, de stabiele naar de
// gesloten test of productie. De beta krijgt het hogere versionCode, zodat
// testers die in beide lijsten staan de beta houden. Lokaal: beta.
def stable = System.getenv('FLUISTERVINK_KANAAL') == 'stable'

android {
    namespace = "nl.hegmus.fluistervink"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "nl.hegmus.fluistervink"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode commitCount * 2 + (stable ? 0 : 1)
        versionName "0.${commitCount} (${commitHash})"
        resValue "string", "app_name", stable ? "Fluistervink" : "Fluistervink Beta"
        resValue "string", "title_activity_main", stable ? "Fluistervink" : "Fluistervink Beta"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadKeystore) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (uploadKeystore) {
                signingConfig signingConfigs.upload
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Play Integrity: aanmelden zonder toegangscode (IntegriteitPlugin.java)
    implementation "com.google.android.play:integrity:1.4.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
