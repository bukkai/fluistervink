<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Feature graphic</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
      }
      body {
        background: #f4f1ed;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: #24221f;
        position: relative;
      }
      .bird {
        position: absolute;
        left: -30px;
        bottom: -40px;
        width: 560px;
        height: 532px;
      }
      .text {
        position: absolute;
        left: 520px;
        top: 0;
        bottom: 0;
        right: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      h1 {
        margin: 0;
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #545a6b;
        line-height: 1;
      }
      p {
        margin: 22px 0 0;
        font-size: 34px;
        line-height: 1.25;
        font-weight: 500;
      }
      .quote {
        margin-top: 26px;
        font-size: 26px;
        color: #8f5530;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <svg class="bird" viewBox="0 0 343 326" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M20 400 L20 220 C60 170 100 120 150 100 C200 85 245 120 255 160 L258 190 C255 230 245 280 232 300 C222 316 205 360 195 400 Z"

        fill="#6f7587"
      />
      <path
        d="M240 158 C255 150 270 152 285 165 C297 172 310 178 312 186 C290 192 265 198 245 201 C235 195 232 170 240 158 Z"
        fill="#ada99d"
      />

    <div class="text">
      <h1>Fluistervink</h1>
      <p>Zeg wat je ziet of hoort.<br />De app schrijft het op.</p>

</html>
