# Bij elke pull request (en elke push naar main): opmaak, typecheck, tests, een
# proefbuild en een controle op bekende lekken. Het deployen zelf doet
# Cloudflare (Workers Builds).
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Alleen de pakketten die meegaan naar de telefoon en de Worker; lekken in
      # ontwikkelpakketten (tests, wrangler) komen via Dependabot en de
      # kwaliteitsronde (docs/kwaliteitsronde.md)
      - run: npm audit --omit=dev --audit-level=high
