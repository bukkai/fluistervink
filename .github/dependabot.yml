# Dependabot: elke maandag een PR met updates, zodat pakketten niet stilletjes
# verouderen. Kleine updates (minor en patch) gebundeld in één PR per soort;
# grote (major) los, want die kunnen iets breken. Een update voor een bekend
# lek komt meteen, los van dit schema (repo-instelling "Dependabot security
# updates"). Zie docs/kwaliteitsronde.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      klein:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 pas als svelte-check het ondersteunt (nu alleen ^5 of ^6)
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Hoort bij de versie van Node waarop we draaien (22, zie check.yml),
      # niet bij de nieuwste: tegelijk ophogen met de Node-versie
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ['*']
