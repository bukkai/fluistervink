<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Kop van een mannetjesvink: blauwgrijze kruin en nek, oranje wang en
       borst, zwart bandje boven de snavel. Groot en eenvoudig, zodat hij ook
       klein herkenbaar blijft. Binnen de veilige zone voor maskable icons. -->
  <defs>
    <clipPath id="kop">
      <path d="M90 512 C95 420 70 360 85 290 C100 170 180 110 260 110 C340 110 395 170 395 250 C395 330 370 380 390 512 Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#4b6a84"/>
  <g clip-path="url(#kop)">
    <!-- Wang, keel en borst -->
    <rect width="512" height="512" fill="#d9875a"/>
    <!-- Kruin en nek -->
    <path d="M0 0 H512 V196 C420 186 330 192 290 205 C230 225 190 300 175 380 C165 440 150 480 140 512 H0 Z" fill="#a3b4d0"/>
  </g>
  <!-- Zwart bandje op het voorhoofd -->
  <path d="M350 192 C364 194 376 202 385 213 L379 224 C370 214 359 208 346 205 Z" fill="#1f2328"/>
  <!-- Snavel -->
  <path d="M378 212 C405 218 432 230 452 246 C432 260 405 270 380 274 C386 254 386 232 378 212 Z" fill="#8a97ad"/>
  <path d="M452 246 C430 248 405 248 382 246" stroke="#5f6b80" stroke-width="5" fill="none"/>
  <!-- Oog -->
  <circle cx="318" cy="236" r="22" fill="#1f2328"/>
  <circle cx="326" cy="228" r="6" fill="#ffffff"/>
</svg>
