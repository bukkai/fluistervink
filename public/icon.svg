  <path d="M160 270 L100 230 L150 310 Z" fill="#2b2522"/>
  <rect x="235" y="355" width="10" height="45" fill="#f4f1ed"/>
  <rect x="270" y="355" width="10" height="45" fill="#f4f1ed"/>
